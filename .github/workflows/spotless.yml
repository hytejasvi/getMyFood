name: Spotless Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  spotless:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ "user-service", "order-service" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Spotless check
        run: |
          cd ${{ matrix.service }}
          mvn spotless:check
        continue-on-error: false
