name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "user-service", "order-service", "restaurant-service" ]

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # 3️⃣ Spotless check (runs for all services)
      - name: Spotless Check
        run: |
          cd ${{ matrix.service }}
          mvn spotless:check

      # 4️⃣ Run tests & generate coverage (only for user-service)
      - name: Run tests and generate coverage
        if: matrix.service == 'user-service'
        run: |
          cd ${{ matrix.service }}
          mvn clean verify

      # 5️⃣ Upload JaCoCo report as artifact (only for user-service)
      - name: Upload JaCoCo report
        if: matrix.service == 'user-service'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco

      # 6️⃣ Upload coverage to Codecov (optional, only if token exists)
      - name: Upload coverage to Codecov
        if: matrix.service == 'user-service' && github.event.repository.private == true && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.service }}/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
