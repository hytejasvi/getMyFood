name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "user-service", "order-service" ]

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # 3️⃣ Spotless check (✅ runs for ALL services)
      - name: Spotless Check
        run: |
          cd ${{ matrix.service }}
          mvn spotless:check

      # 4️⃣ Run tests & generate coverage report (🚫 only for user-service)
      - name: Run tests and generate coverage
        if: matrix.service == 'user-service'
        run: |
          cd ${{ matrix.service }}
          mvn clean verify

      # 5️⃣ Upload JaCoCo coverage report as artifact (🚫 only for user-service)
      - name: Upload coverage report
        if: matrix.service == 'user-service'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco

      # 6️⃣ Upload coverage to Codecov (🚫 only for user-service)
      - name: Upload coverage to Codecov
        if: matrix.service == 'user-service'
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.service }}/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          # TODO: Remove the "if: matrix.service == 'user-service'" condition
          # once test cases are added for order-service so coverage runs there too.
