server:
  port: 8081 # Different port than user-service (8080)

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  datasource:
    url: jdbc:mysql://localhost:3306/getmyfood_restaurant
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # Start with 'update', can change to 'validate' later
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092 # We'll set this up later

# JWT configuration for validating tokens from user-service
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatIs32charsOrMore} # Should match user-service secret
  expiration: 3600000

logging:
  level:
    com.getyourfood.restaurantservice: DEBUG